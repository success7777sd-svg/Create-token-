<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bezpieczny Menedżer Tokenów EVM</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Ethers.js v6 CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.5/ethers.umd.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6">
    <div class="max-w-3xl mx-auto space-y-6">
        
        <!-- Nagłówek -->
        <header class="bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700">
            <h1 class="text-2xl font-bold text-emerald-400">Bezpieczny Menedżer Tokenów</h1>
            <p class="text-slate-400 text-sm mt-1">Zarządzaj i wysyłaj tokeny za pomocą portfela MetaMask (brak ryzyka wycieku klucza).</p>
        </header>

        <!-- Sekcja Połączenia z Portfelem -->
        <section class="bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700 space-y-4">
            <h2 class="text-xl font-semibold text-blue-400">1. Połączenie z Portfelem i Siecią</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-300">Natywna Waluta Sieci (Paliwo, np. POL, ETH)</label>
                    <input type="text" id="nativeCurrency" value="POL" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300">Twój Adres Portfela</label>
                    <input type="text" id="walletAddress" value="Nie połączono" disabled class="w-full mt-1 bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-slate-400 font-mono">
                </div>
            </div>

            <button onclick="connectWallet()" class="w-full bg-blue-600 hover:bg-blue-700 font-medium py-2.5 rounded-lg transition duration-200 shadow-md">
                Połącz z MetaMask / Portfelem
            </button>
        </section>

        <!-- Sekcja Kontraktu i Tokena -->
        <section class="bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700 space-y-4">
            <h2 class="text-xl font-semibold text-purple-400">2. Adres Kontraktu Tokena</h2>
            
            <div>
                <label class="block text-sm font-medium text-slate-300">Contract Address (Adres Twojego tokena)</label>
                <input type="text" id="contractAddress" placeholder="0x..." class="w-full mt-1 bg-slate-900 border border-purple-500/50 rounded-lg p-2.5 text-sm font-mono text-emerald-400 outline-none focus:ring-2 focus:ring-purple-500">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-300">Symbol Tokena</label>
                    <input type="text" id="tokenSymbol" placeholder="np. MPT" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300">Decimals</label>
                    <input type="number" id="tokenDecimals" value="18" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm outline-none">
                </div>
            </div>

            <button onclick="loadTokenInfo()" class="w-full bg-purple-600 hover:bg-purple-700 font-medium py-2.5 rounded-lg transition duration-200 shadow-md">
                Sprawdź Token w Sieci
            </button>
        </section>

        <!-- Sekcja Wysyłania -->
        <section class="bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700 space-y-4">
            <h2 class="text-xl font-semibold text-emerald-400">3. Wyślij Token na Dowolny Adres</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-300">Adres Odbiorcy (Recipient)</label>
                    <input type="text" id="recipientAddress" placeholder="0x..." class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm font-mono focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300">Ilość do wysłania</label>
                    <input type="text" id="sendAmount" placeholder="100" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
            </div>

            <button onclick="sendTokens()" class="w-full bg-emerald-600 hover:bg-emerald-700 font-medium py-2.5 rounded-lg transition duration-200 shadow-md">
                Wyślij Tokeny (Potwierdź w MetaMask)
            </button>
        </section>

        <!-- Konsola -->
        <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 font-mono text-xs text-slate-400 h-32 overflow-y-auto" id="consoleLog">
            [System] Gotowy. Połącz portfel, aby rozpocząć...
        </div>

    </div>

    <script>
        let provider;
        let signer;

        function log(message) {
            const consoleBox = document.getElementById('consoleLog');
            consoleBox.innerHTML += `<div>> ${message}</div>`;
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }

        async function connectWallet() {
            if (!window.ethereum) {
                alert("Nie wykryto portfela typu MetaMask w przeglądarce!");
                return;
            }
            try {
                log("Łączenie z portfelem...");
                provider = new ethers.BrowserProvider(window.ethereum);
                await provider.send("eth_requestAccounts", []);
                signer = await provider.getSigner();
                const address = await signer.getAddress();
                
                document.getElementById('walletAddress').value = address;
                log(`Połączono pomyślnie z adresem: ${address}`);
            } catch (error) {
                console.error(error);
                log(`Błąd połączenia: ${error.message}`);
            }
        }

        const ERC20_ABI = [
            "function symbol() view returns (string)",
            "function decimals() view returns (uint8)",
            "function transfer(address recipient, uint256 amount) returns (bool)"
        ];

        async function loadTokenInfo() {
            try {
                if (!signer) {
                    alert("Najpierw połącz portfel (Krok 1)!");
                    return;
                }
                const contractAddress = document.getElementById('contractAddress').value;
                if (!contractAddress) {
                    alert("Wpisz adres kontraktu!");
                    return;
                }

                log("Odczytywanie danych tokena...");
                const contract = new ethers.Contract(contractAddress, ERC20_ABI, provider);
                const symbol = await contract.symbol();
                const decimals = await contract.decimals();

                document.getElementById('tokenSymbol').value = symbol;
                document.getElementById('tokenDecimals').value = decimals;
                log(`Załadowano token: ${symbol} (Decimals: ${decimals})`);
                alert(`Sukces! Znaleziono token: ${symbol}`);
            } catch (error) {
                console.error(error);
                log(`Błąd: ${error.message}`);
                alert("Nie udało się odczytać tokena pod tym adresem.");
            }
        }

        async function sendTokens() {
            try {
                if (!signer) {
                    alert("Najpierw połącz portfel!");
                    return;
                }
                const contractAddress = document.getElementById('contractAddress').value;
                const recipient = document.getElementById('recipientAddress').value;
                const amount = document.getElementById('sendAmount').value;
                const decimals = parseInt(document.getElementById('tokenDecimals').value) || 18;
                const currency = document.getElementById('nativeCurrency').value;

                if (!contractAddress || !recipient || !amount) {
                    alert("Wypełnij wszystkie pola w sekcji wysyłania!");
                    return;
                }

                log(`Przygotowanie przelewu ${amount} tokenów... Używana waluta sieci: ${currency}`);
                const contract = new ethers.Contract(contractAddress, ERC20_ABI, signer);
                const parsedAmount = ethers.parseUnits(amount, decimals);

                log("Oczekiwanie na potwierdzenie w MetaMasku...");
                const tx = await contract.transfer(recipient, parsedAmount);
                log(`Transakcja wysłana! Hash: ${tx.hash}`);

                await tx.wait();
                log("Transakcja została potwierdzona przez sieć!");
                alert("Tokeny zostały pomyślnie wysłane!");

            } catch (error) {
                console.error(error);
                log(`Błąd wysyłki: ${error.message}`);
                alert("Transakcja została odrzucona lub wystąpił błąd.");
            }
        }
    </script>
</body>
</html>
