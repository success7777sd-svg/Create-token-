<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BNB to Polygon BTCB Bridge</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Ethers.js v6 CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.5/ethers.umd.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6">
    <div class="max-w-2xl mx-auto space-y-6">
        
        <!-- Nagłówek -->
        <header class="bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700 text-center">
            <h1 class="text-2xl font-bold text-amber-400">BTCB Cross-Chain Bridge (BNB ➡️ Polygon)</h1>
            <p class="text-slate-400 text-sm mt-1">Przenieś BTCB z sieci BNB Chain i odbierz swój ekwiwalent w sieci Polygon (8 Decimals).</p>
        </header>

        <!-- Panel Połączenia z Portfelem -->
        <section class="bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700 space-y-4">
            <h2 class="text-lg font-semibold text-blue-400">1. Portfel i Adres Skarbca</h2>
            
            <div class="space-y-3">
                <div>
                    <label class="block text-sm font-medium text-slate-300">Twój Adres (MetaMask)</label>
                    <input type="text" id="walletAddress" value="Nie połączono" disabled class="w-full mt-1 bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-slate-400 font-mono">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300">Adres Skarbca (Gdzie użytkownicy wpłacają BTCB na BNB)</label>
                    <input type="text" id="vaultAddress" placeholder="0x..." class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm font-mono focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
            </div>

            <button onclick="connectWallet()" class="w-full bg-blue-600 hover:bg-blue-700 font-medium py-2.5 rounded-lg transition duration-200 shadow-md">
                Połącz z MetaMask
            </button>
        </section>

        <!-- KROK 1: Wpłata w sieci BNB -->
        <section class="bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700 space-y-4">
            <h2 class="text-lg font-semibold text-amber-400">Krok 1: Zablokuj / Wyślij BTCB (Sieć BNB Chain)</h2>
            
            <div>
                <label class="block text-sm font-medium text-slate-300">Adres Kontraktu BTCB w sieci BNB</label>
                <input type="text" id="btcbBnbContract" value="0x7130d2a12b9bcbfae4f2634d864a1ee1ce3ead9c" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm font-mono outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300">Ilość BTCB do zablokowania</label>
                <input type="number" id="depositAmount" placeholder="0.001" step="0.00000001" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm outline-none">
            </div>

            <button onclick="depositBnbBtc()" class="w-full bg-amber-600 hover:bg-amber-700 font-medium py-2.5 rounded-lg transition duration-200 shadow-md">
                Wyślij BTCB na BNB (Zatwierdź)
            </button>
        </section>

        <!-- KROK 2: Wypłata w sieci Polygon -->
        <section class="bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700 space-y-4">
            <h2 class="text-lg font-semibold text-purple-400">Krok 2: Odbierz / Wyemituj token w sieci Polygon</h2>
            
            <div>
                <label class="block text-sm font-medium text-slate-300">Adres Twojego kontraktu ekwiwalentu BTC w Polygon (8 Decimals)</label>
                <input type="text" id="polygonTokenContract" placeholder="0x..." class="w-full mt-1 bg-slate-900 border border-purple-500/50 rounded-lg p-2.5 text-sm font-mono text-emerald-400 outline-none">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-300">Adres Odbiorcy w Polygon</label>
                    <input type="text" id="recipientPolygon" placeholder="0x..." class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm font-mono outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300">Ilość do wydania</label>
                    <input type="number" id="mintAmount" placeholder="0.001" step="0.00000001" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm outline-none">
                </div>
            </div>

            <button onclick="releasePolygonBtc()" class="w-full bg-purple-600 hover:bg-purple-700 font-medium py-2.5 rounded-lg transition duration-200 shadow-md">
                Przekaż / Wyślij w sieci Polygon (Zatwierdź)
            </button>
        </section>

        <!-- Konsola -->
        <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 font-mono text-xs text-slate-400 h-28 overflow-y-auto" id="consoleLog">
            [System] Gotowy. Połącz portfel...
        </div>

    </div>

    <script>
        let provider, signer;

        function log(message) {
            const consoleBox = document.getElementById('consoleLog');
            consoleBox.innerHTML += `<div>> ${message}</div>`;
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }

        async function connectWallet() {
            if (!window.ethereum) {
                alert("Brak portfela MetaMask!");
                return;
            }
            try {
                provider = new ethers.BrowserProvider(window.ethereum);
                await provider.send("eth_requestAccounts", []);
                signer = await provider.getSigner();
                const address = await signer.getAddress();
                document.getElementById('walletAddress').value = address;
                document.getElementById('vaultAddress').value = address; // Domyślnie Twój adres jako skarbnik
                document.getElementById('recipientPolygon').value = address;
                log(`Połączono z portfelem: ${address}`);
            } catch (error) {
                console.error(error);
                log(`Błąd połączenia: ${error.message}`);
            }
        }

        // Standardowy ABI dla transferu tokena ERC20 / BEP20
        const ERC20_TRANSFER_ABI = [
            "function transfer(address to, uint256 value) returns (bool)",
            "function decimals() view returns (uint8)"
        ];

        async function depositBnbBtc() {
            try {
                const tokenAddress = document.getElementById('btcbBnbContract').value;
                const vault = document.getElementById('vaultAddress').value;
                const amount = document.getElementById('depositAmount').value;

                if (!tokenAddress || !vault || !amount) {
                    alert("Wypełnij wszystkie pola w Kroku 1!");
                    return;
                }

                log("Wysyłanie BTCB w sieci BNB do skarbca...");
                const contract = new ethers.Contract(tokenAddress, ERC20_TRANSFER_ABI, signer);
                
                // BTCB ma zazwyczaj 18 miejsc po przecinku w sieci BNB, ale weźmiemy to dynamicznie lub bezpiecznie 18
                const parsedAmount = ethers.parseUnits(amount, 18); 

                const tx = await contract.transfer(vault, parsedAmount);
                log(`Transakcja wysłana w sieci BNB: ${tx.hash}`);
                await tx.wait();
                log("BTCB pomyślnie zablokowane w skarbcu!");
                alert("Blokada BTCB zakończona sukcesem. Przejdź do Kroku 2.");
            } catch (error) {
                console.error(error);
                log(`Błąd wpłaty: ${error.message}`);
                alert("Wystąpił błąd podczas wpłaty BTCB.");
            }
        }

        async function releasePolygonBtc() {
            try {
                const tokenAddress = document.getElementById('polygonTokenContract').value;
                const recipient = document.getElementById('recipientPolygon').value;
                const amount = document.getElementById('mintAmount').value;

                if (!tokenAddress || !recipient || !amount) {
                    alert("Wypełnij wszystkie pola w Kroku 2!");
                    return;
                }

                log("Wysyłanie ekwiwalentu BTC w sieci Polygon (8 Decimals)...");
                const contract = new ethers.Contract(tokenAddress, ERC20_TRANSFER_ABI, signer);
                
                // Kluczowa zmiana: Twój token w Polygon ma dokładnie 8 miejsc po przecinku (Decimals = 8)
                const parsedAmount = ethers.parseUnits(amount, 8); 

                const tx = await contract.transfer(recipient, parsedAmount);
                log(`Transakcja wysłana w sieci Polygon: ${tx.hash}`);
                await tx.wait();
                log("Ekwiwalent BTC doręczony na adres w sieci Polygon!");
                alert("Operacja zakończona sukcesem w sieci Polygon!");
            } catch (error) {
                console.error(error);
                log(`Błąd Polygon: ${error.message}`);
                alert("Wystąpił błąd podczas wysyłki w sieci Polygon.");
            }
        }
    </script>
</body>
</html>
