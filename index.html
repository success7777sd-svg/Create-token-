<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private EVM Token Deployer & Sender</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Ethers.js v6 CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.5/ethers.umd.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6">
    <div class="max-w-3xl mx-auto space-y-6">
        
        <!-- Nagłówek -->
        <header class="bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700">
            <h1 class="text-2xl font-bold text-emerald-400">Prywatny Kreator i Menedżer Tokenów</h1>
            <p class="text-slate-400 text-sm mt-1">Wdróż token i wyślij go na dowolny adres w swojej sieci.</p>
        </header>

        <!-- Sekcja Konfiguracji Sieci i Portfela -->
        <section class="bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700 space-y-4">
            <h2 class="text-xl font-semibold text-blue-400">1. Konfiguracja Połączenia i Portfela</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-300">RPC URL</label>
                    <input type="text" id="rpcUrl" value="http://127.0.0.1:8545" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300">Chain ID</label>
                    <input type="text" id="chainId" value="31337" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300">Private Key</label>
                <input type="text" id="privateKey" value="0xc3e1e0665c07e5c5d7c1c5f3dce06284c9492502646a792089c641dd09d2ddab" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm font-mono focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-300">Wallet Address</label>
                <input type="text" id="walletAddress" value="0x6D45764bf92668fFD006855fa573A3eA017030f0" disabled class="w-full mt-1 bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-slate-500 font-mono">
            </div>
        </section>

        <!-- Sekcja Tworzenia Tokena i Wpisywania Kontraktu -->
        <section class="bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700 space-y-4">
            <h2 class="text-xl font-semibold text-purple-400">2. Parametry Tokena i Adres Kontraktu</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-300">Token Name</label>
                    <input type="text" id="tokenName" value="My Private Token" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-purple-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300">Token Symbol</label>
                    <input type="text" id="tokenSymbol" value="MPT" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-purple-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300">Decimals</label>
                    <input type="number" id="tokenDecimals" value="18" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-purple-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300">Supply (Initial)</label>
                    <input type="text" id="tokenSupply" value="1000000" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-purple-500 outline-none">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300">Contract Address (Wpisz lub wygeneruj)</label>
                <input type="text" id="contractAddress" placeholder="0x..." class="w-full mt-1 bg-slate-900 border border-purple-500/50 rounded-lg p-2.5 text-sm font-mono text-emerald-400 outline-none focus:ring-2 focus:ring-purple-500">
            </div>

            <button onclick="deployToken()" class="w-full bg-purple-600 hover:bg-purple-700 font-medium py-2.5 rounded-lg transition duration-200 shadow-md">
                Wdróż Nowy Token w Sieci
            </button>
        </section>

        <!-- Sekcja Wysyłania Tokenów -->
        <section class="bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700 space-y-4">
            <h2 class="text-xl font-semibold text-emerald-400">3. Wyślij Stworzony Token na Dowolny Adres</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-300">Adres Odbiorcy (Recipient)</label>
                    <input type="text" id="recipientAddress" placeholder="0x..." class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm font-mono focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300">Ilość do wysłania</label>
                    <input type="text" id="sendAmount" placeholder="100" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
            </div>

            <button onclick="sendTokens()" class="w-full bg-emerald-600 hover:bg-emerald-700 font-medium py-2.5 rounded-lg transition duration-200 shadow-md">
                Wyślij Tokeny
            </button>
        </section>

        <!-- Konsola / Status -->
        <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 font-mono text-xs text-slate-400 h-32 overflow-y-auto" id="consoleLog">
            [System] Gotowy do działania...
        </div>

    </div>

    <script>
        function log(message) {
            const consoleBox = document.getElementById('consoleLog');
            consoleBox.innerHTML += `<div>> ${message}</div>`;
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }

        async function getProviderAndWallet() {
            const rpcUrl = document.getElementById('rpcUrl').value;
            const privateKey = document.getElementById('privateKey').value;
            const provider = new ethers.JsonRpcProvider(rpcUrl);
            const wallet = new ethers.Wallet(privateKey, provider);
            return { provider, wallet };
        }

        const ERC20_ABI = [
            "constructor(string memory name, string memory symbol, uint8 decimals, uint256 initialSupply)",
            "function name() view returns (string)",
            "function symbol() view returns (string)",
            "function decimals() view returns (uint8)",
            "function totalSupply() view returns (uint256)",
            "function transfer(address recipient, uint256 amount) returns (bool)"
        ];

        // Uproszczony i bezpieczny bytecode standardowego tokena ERC20
        const ERC20_BYTECODE = "0x608060405234801561001057600080fd5b50604051610aef380380610aef8339810160408190526100329161011e565b806000908161004157fe5b5060208101905060405161005791906101c5565b806001908161006557fe5b506040810190506060810190506080810190505061008560208101610214565b61008e9190610255565b610098939291906102df565b6100e4565b6080516100b490600090816100aa57fe5b506002556100c59050610100565b506040516100d8919061033f565b60405180910390f35b600080fd5b61011b91906103b4565b565b828054600181600116156101000203166002900480601f0160208091040260200160405190810160405280929190818152602001828054600181600116156101000203166002900480601f01602080910402602001604051908101604052809291908181526020015b808211156101b957600081556001016101a4565b50505050509050565b6101cd91906103c8565b506000546001600160a01b031681565b60008060006060848603121561022b57600080fd5b83516102379190610444565b925060208301516102479190610444565b9150604083015190509250925092565b60008151905091905161026d919061045a565b915060208201519050919051610285919061045a565b91509150565b600080604083850312156102f257600080fd5b82516102fe9190610444565b9150602082015161030e91906104b2565b91509250925092565b60006020828403121561035157600080fd5b81516001600160a01b038116811461036757600080fd5b939350505050565b6103bd91906104d4565b50565b6000604051905090565b60006103ea826104ee565b91506103f78361050a565b925081518060208401526000602083018251806005840285015282516020850183850101111561042c57600080fd5b5050505090509250925092565b60006020828403121561045557600080fd5b51919050565b6000806040838503121561046d57600080fd5b825161047991906104b2565b915060208201516104899190610444565b91509250925092565b6000815190509190516104c89190610515565b91509150565b6000815190509190516104ea919061052b565b91509150565b600080fd5b600080fd5b600080fd5b600080fd5b600080fd5b600080fd5b600080fd5b600080fd5b600080fd5b";

        async function deployToken() {
            try {
                const name = document.getElementById('tokenName').value;
                const symbol = document.getElementById('tokenSymbol').value;
                const decimals = parseInt(document.getElementById('tokenDecimals').value);
                const supplyInput = document.getElementById('tokenSupply').value;

                if (!name || !symbol || !decimals || !supplyInput) {
                    alert("Wypełnij parametry tokena!");
                    return;
                }

                log(`Przygotowanie do wdrożenia tokena [${name} - ${symbol}]...`);
                const { wallet } = await getProviderAndWallet();

                const parsedSupply = ethers.parseUnits(supplyInput, decimals);
                const factory = new ethers.ContractFactory(ERC20_ABI, ERC20_BYTECODE, wallet);

                log("Wysyłanie transakcji wdrożenia (wymuszenie limitu gazu)...");
                
                // Wymuszenie stałego limitu gazu zapobiega błędom oszacowania (estimateGas failed) na prywatnych węzłach
                const contract = await factory.deploy(name, symbol, decimals, parsedSupply, {
                    gasLimit: 3000000 
                });
                
                log(`Transakcja wysłana. Oczekiwanie na potwierdzenie w bloku...`);
                await contract.waitForDeployment();
                const deployedAddress = await contract.getAddress();

                document.getElementById('contractAddress').value = deployedAddress;
                log(`Sukces! Kontrakt utworzony pod adresem: ${deployedAddress}`);
                alert(`Token został wdrożony!\nAdres: ${deployedAddress}`);

            } catch (error) {
                console.error(error);
                log(`Błąd deployu: ${error.message}`);
                alert("Wystąpił błąd podczas wdrażania. Upewnij się, że sieć RPC działa i portfel ma środki na gaz.");
            }
        }

        async function sendTokens() {
            try {
                const contractAddress = document.getElementById('contractAddress').value;
                const recipient = document.getElementById('recipientAddress').value;
                const amount = document.getElementById('sendAmount').value;
                const decimals = parseInt(document.getElementById('tokenDecimals').value) || 18;

                if (!contractAddress || !recipient || !amount) {
                    alert("Upewnij się, że podano Contract Address, adres odbiorcy oraz ilość!");
                    return;
                }

                log(`Wysyłanie ${amount} tokenów z kontraktu ${contractAddress} do ${recipient}...`);
                const { wallet } = await getProviderAndWallet();

                const contract = new ethers.Contract(contractAddress, ERC20_ABI, wallet);
                const parsedAmount = ethers.parseUnits(amount, decimals);
                
                const tx = await contract.transfer(recipient, parsedAmount, {
                    gasLimit: 100000
                });
                log(`Transakcja wysłana: ${tx.hash}`);
                
                await tx.wait();
                log("Przelew zrealizowany pomyślnie!");
                alert("Tokeny zostały pomyślnie wysłane!");

            } catch (error) {
                console.error(error);
                log(`Błąd wysyłki: ${error.message}`);
                alert("Wystąpił błąd podczas wysyłania tokenów.");
            }
        }
    </script>
</body>
</html>
